<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Documentary Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23161412'/%3E%3Crect x='7' y='9' width='18' height='14' rx='1' fill='none' stroke='%23E8B04B' stroke-width='2'/%3E%3Cpath d='M14 13l5 3-5 3z' fill='%23F4F1EA'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <div class="brand-name" data-i18n="app_name">AI Documentary Studio</div>
        <div class="brand-project" id="current-project">—</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="ghost small" id="lang-toggle" title="Switch interface language">العربية</button>
      <span id="save-state" class="muted small" aria-live="polite"></span>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <div id="jobbar" hidden>
      <div class="jobbar-text"><span id="job-msg"></span> <span id="job-eta" class="muted"></span></div>
      <div class="progress"><div id="job-progress"></div></div>
      <button class="ghost small" id="job-cancel">Cancel</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>
<dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
